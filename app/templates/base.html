<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kairoscan{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="30" height="30">
      <span>Kairoscan</span>
    </a>
    <span class="tag">Evidence-aware deepfake detection</span>
  </div>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <div class="wrap">
    <p>Kairoscan is a college project. Its results are statistical estimates, not proof.</p>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
